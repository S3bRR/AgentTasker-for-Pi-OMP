name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and source package
        run: python -m pip install -e . build
      - name: Public-tree safety checks
        run: python scripts/check_public_tree.py
      - name: Verify the source package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tasker-workspace"
          python install.py --client generic --skip-install --venv "$pythonLocation" \
            --cwd "$RUNNER_TEMP/tasker-workspace" --allow-shell \
            > "$RUNNER_TEMP/tasker-source.json"
          python -m agent_tasker_mcp.doctor --config "$RUNNER_TEMP/tasker-source.json" --shell-test
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify a clean wheel install and doctor
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tasker-clean"
          "$RUNNER_TEMP/tasker-clean/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/tasker-workspace"
          python install.py --client generic --skip-install --venv "$RUNNER_TEMP/tasker-clean" \
            --cwd "$RUNNER_TEMP/tasker-workspace" --allow-shell \
            > "$RUNNER_TEMP/tasker-generated.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tasker-clean/bin/agent-tasker-doctor" \
            --config "$RUNNER_TEMP/tasker-generated.json" --shell-test
